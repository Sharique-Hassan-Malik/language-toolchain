[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name        = "zap"
version     = "1.0.0"
description = "Zap toy-language compiler (Python implementation)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zapc = "scripts.zapc:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
