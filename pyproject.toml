[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolchain"
version = "1.0.0"
description = "A compiler, the WebAssembly runtime it targets, and the tools around them"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Every Python module here runs on the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lang = "toolchain.cli:main"

[tool.setuptools.packages.find]
include = ["toolchain*"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
# importlib import mode: several modules ship their own `tests` package, and
# the default prepend mode resolves them all to one top-level name, so
# collecting them in a single run collides. Each module's own `pytest` still
# works unchanged from its own folder.
addopts = "-q --import-mode=importlib"
