name: Keep Repository Active

# GitHub disables scheduled Actions workflows on repositories that have had
# no activity for 60 days.  This workflow makes an empty commit every Sunday
# to keep the repo active without cluttering the commit history with changes.

on:
  schedule:
    - cron: "0 0 * * 0"   # every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push empty commit
        run: |
          git commit --allow-empty -m "chore: keep repository active [skip ci]"
          git push
